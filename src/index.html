<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MULA</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <nav class="tab-bar">
      <button class="tab active" data-tab="system">System</button>
      <button class="tab" data-tab="vsd">VSD Server</button>
    </nav>

    <main class="tab-content">
      <!-- System / About -->
      <section id="tab-system" class="tab-panel active">
        <div class="about-card">
          <img src="/assets/mula-logo.png" class="app-logo" alt="MULA logo" />
          <h1>MULA</h1>
          <p class="subtitle">Managed Utility Local Automator</p>

          <table class="info-table">
            <tr>
              <td class="label">Version</td>
              <td id="app-version" class="value">...</td>
            </tr>
            <tr>
              <td class="label">Platform</td>
              <td id="app-platform" class="value">...</td>
            </tr>
            <tr>
              <td class="label">Architecture</td>
              <td id="app-arch" class="value">...</td>
            </tr>
            <tr>
              <td class="label">Config path</td>
              <td class="value mono"><a href="#" id="app-config-path" class="config-link">...</a></td>
            </tr>
          </table>
        </div>
      </section>

      <!-- VSD Server -->
      <section id="tab-vsd" class="tab-panel vsd-panel">
        <div class="vsd-toolbar">
          <button id="vsd-toggle" class="vsd-toggle stopped" title="Start VSD Server">
            <span class="toggle-icon"></span>
            <span class="toggle-label">Start</span>
          </button>
          <label class="autostart-toggle" title="Start VSD server automatically when MULA opens">
            <input type="checkbox" id="vsd-autostart">
            <span class="autostart-switch"></span>
            <span class="toolbar-label">Autostart</span>
          </label>
          <span class="toolbar-separator"></span>
          <span class="toolbar-label">Download:</span>
          <button id="vsd-download-dir" class="vsd-btn" title="Change download location">
            <span class="btn-icon folder-icon"></span>
            <span id="vsd-dir-label" class="btn-text">...</span>
          </button>
          <span class="toolbar-separator"></span>
          <span class="toolbar-label">Extension:</span>
          <button id="vsd-install-chrome" class="vsd-btn browser-btn" title="Install extension in Chrome">
            <span class="btn-icon chrome-icon"></span>
            <span class="btn-text">Chrome</span>
          </button>
          <button id="vsd-install-firefox" class="vsd-btn browser-btn" title="Install extension in Firefox">
            <span class="btn-icon firefox-icon"></span>
            <span class="btn-text">Firefox</span>
          </button>
        </div>
        <div class="vsd-log" id="vsd-log">
          <pre id="vsd-log-content">VSD Server stopped. Press Start to begin.</pre>
        </div>
      </section>
    </main>
  </body>
</html>
