<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MULA</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <nav class="tab-bar">
      <button class="tab active" data-tab="system">System</button>
      <button class="tab" data-tab="vsd">VSD Server</button>
    </nav>

    <main class="tab-content">
      <!-- System / About -->
      <section id="tab-system" class="tab-panel active">
        <div class="about-card">
          <img src="/assets/tauri.svg" class="app-logo" alt="MULA logo" />
          <h1>MULA</h1>
          <p class="subtitle">Managed Utility Local Automator</p>

          <table class="info-table">
            <tr>
              <td class="label">Version</td>
              <td id="app-version" class="value">...</td>
            </tr>
            <tr>
              <td class="label">Platform</td>
              <td id="app-platform" class="value">...</td>
            </tr>
            <tr>
              <td class="label">Architecture</td>
              <td id="app-arch" class="value">...</td>
            </tr>
            <tr>
              <td class="label">Config path</td>
              <td class="value mono"><a href="#" id="app-config-path" class="config-link">...</a></td>
            </tr>
          </table>
        </div>
      </section>

      <!-- VSD Server (placeholder) -->
      <section id="tab-vsd" class="tab-panel">
        <div class="placeholder">
          <h2>VSD Server</h2>
          <p>Coming soon.</p>
        </div>
      </section>
    </main>
  </body>
</html>
